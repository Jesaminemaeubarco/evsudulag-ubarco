<div class="container">
    <div class="form-container">
        
        <form class="form" [formGroup]="loginForm" (ngSubmit)="onLogin()">

            <h3 class="title">Login To Continue</h3>

                <mat-form-field>
                  <mat-label>Username</mat-label>
                  <input type="email" matInput formControlName="username">
                  
                    <mat-error *ngIf="username?.hasError('email')">Username must be an email</mat-error>
                  
                    <mat-error *ngIf="username?.hasError('required')">Username is <strong>required</strong></mat-error>
                  
                </mat-form-field>

                <mat-form-field>
                  <mat-label>Password</mat-label>
                  <input type="email" matInput formControlName="password">
                  
                    <mat-error *ngIf="password?.hasError('required')">Password is <strong>required</strong></mat-error>
                  
                </mat-form-field>

                <button type="submit" [disabled]="loginForm.invalid" mat-flat-button>Login</button>
              
        </form>
    </div>
</div>
